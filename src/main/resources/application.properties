# Should be disabled by default
spring.jpa.open-in-view=false
# Data upload
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
# Logging defaults
logging.level.*=INFO
logging.level.org.springframework=ERROR
logging.level.net.tomasbot.matchday=DEBUG
logging.logback.rollingpolicy.max-file-size=16MB
management.endpoints.web.exposure.include=loggers
management.endpoint.loggers.enabled=true
# Other properties
spring.config.import=classpath:db.properties,classpath:vpn.properties,classpath:settings.default.properties
application.api.version=1
server.servlet.contextPath=/api/v\${application.api.version}
application.config.root=\${CONFIG_ROOT}
application.connection-manager.max-redirect-depth=5
# Ensure this value matches that used by the Flaresolverr instance
application.connection-manager.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36
